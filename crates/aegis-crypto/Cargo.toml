[package]
name = "calibre-aegis-crypto"
version = "0.1.0"
edition = "2021"

[dependencies]
parity-scale-codec = { workspace = true }
scale-info = { workspace = true }
sp-core = { workspace = true }
sp-runtime = { workspace = true }
sp-std = { workspace = true }
sha3 = { workspace = true }
dilithium-rs = { version = "0.4", default-features = false }
calibre-primitives = { workspace = true }

[features]
default = ["std"]
std = ["parity-scale-codec/std", "scale-info/std", "sp-core/std", "sp-runtime/std", "sp-std/std", "sha3/std", "calibre-primitives/std"]
