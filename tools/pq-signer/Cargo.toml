[package]
name = "pq-signer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pq-signer"
path = "src/main.rs"

[[bin]]
name = "calibre-keygen"
path = "src/main.rs"

[dependencies]
dilithium-rs = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sp-core = { workspace = true, features = ["blake2", "std"] }
